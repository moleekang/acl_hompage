<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Cards</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:start}.card-white{background:#fff;border:1px solid var(--border-1);border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}.card-paper{background:#FAF6E9;border:1px solid var(--border-1);border-radius:6px;padding:18px;box-shadow:var(--shadow-paper);transform:rotate(-1deg)}.card-sticker{background:var(--sun-400);border:2px solid var(--ink-900);border-radius:8px;padding:14px;box-shadow:var(--shadow-stamp);transform:rotate(2deg);font-family:var(--font-hand);font-weight:700;font-size:20px;color:var(--ink-900)}</style>
</head><body>
<div class="grid">
  <div class="card-white"><div class="micro" style="margin-bottom:8px;color:var(--text-mint)">WHITE CARD</div><h3 style="margin:0 0 6px;font-family:var(--font-body)">기본 정보 카드</h3><p style="margin:0;font-size:14px;color:var(--fg-2)">대부분의 그리드와 리스트에 사용</p></div>
  <div class="card-paper"><div class="micro" style="margin-bottom:6px;color:var(--text-hot)">PAPER · 인용</div><h3 class="h-gaegu" style="font-size:24px;margin:0 0 6px">"6개월 헤맸어요."</h3><p style="margin:0;font-size:13px;color:var(--fg-3)">— 운영자, logs/2025-12</p></div>
  <div class="card-sticker">자~ 이거 봐보세요!</div>
</div></body></html>
