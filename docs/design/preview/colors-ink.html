<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Colors — Ink Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--ink-900);font-family:var(--font-body)}
  .row{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
  .sw{aspect-ratio:.7;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--border-1)}
  .sw .name{font-size:10px;font-weight:600;letter-spacing:-0.01em}
  .sw .hex{font-family:var(--font-mono);font-size:9px;opacity:.7;margin-top:2px}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:#0E1116;color:#F5F1E8"><div class="name">Ink 900</div><div class="hex">0E1116</div></div>
  <div class="sw" style="background:#161A23;color:#F5F1E8"><div class="name">Ink 800</div><div class="hex">161A23</div></div>
  <div class="sw" style="background:#222732;color:#F5F1E8"><div class="name">Ink 700</div><div class="hex">222732</div></div>
  <div class="sw" style="background:#2E3441;color:#F5F1E8"><div class="name">Ink 600</div><div class="hex">2E3441</div></div>
  <div class="sw" style="background:#404858;color:#F5F1E8"><div class="name">Ink 500</div><div class="hex">404858</div></div>
  <div class="sw" style="background:#6B7384;color:#F5F1E8"><div class="name">Ink 400</div><div class="hex">6B7384</div></div>
  <div class="sw" style="background:#9AA3B2;color:#0E1116"><div class="name">Ink 300</div><div class="hex">9AA3B2</div></div>
  <div class="sw" style="background:#C7CCD5;color:#0E1116"><div class="name">Ink 200</div><div class="hex">C7CCD5</div></div>
  <div class="sw" style="background:#E4E7EC;color:#0E1116"><div class="name">Ink 100</div><div class="hex">E4E7EC</div></div>
</div>
</body></html>
