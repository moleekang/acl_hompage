<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:28px}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 20px;border-radius:8px;font-weight:700;font-size:15px;border:0;cursor:pointer;font-family:var(--font-body)}.btn-primary{background:var(--ink-900);color:var(--paper)}.btn-mint{background:var(--mint-400);color:var(--ink-900);border:2px solid var(--ink-900);box-shadow:var(--shadow-stamp)}.btn-secondary{background:#fff;color:var(--fg-1);border:1px solid var(--border-2)}.btn-hot{background:var(--hot-500);color:#fff}.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);min-width:90px}</style>
</head><body>
<div class="row"><span class="lbl">primary</span><button class="btn btn-primary">유튜브 구독 →</button><button class="btn btn-mint">★ 시작하기</button><button class="btn btn-secondary">자세히 보기</button><button class="btn btn-hot">★ NEW</button></div>
</body></html>
