<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.sw{aspect-ratio:1.4;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;border:1px solid var(--border-1)}.sw .name{font-size:13px;font-weight:700}.sw .hex{font-family:var(--font-mono);font-size:11px;opacity:.7;margin-top:2px}</style>
</head><body>
<div class="row">
  <div class="sw" style="background:var(--mint-400)"><div class="name">Mint 400</div><div class="hex">#7CF5C4</div></div>
  <div class="sw" style="background:var(--electric-500);color:#fff"><div class="name">Electric 500</div><div class="hex">#5A7CFF</div></div>
  <div class="sw" style="background:var(--hot-500);color:#fff"><div class="name">Hot 500</div><div class="hex">#FF6B47</div></div>
  <div class="sw" style="background:var(--sun-400)"><div class="name">Sun 400</div><div class="hex">#FFD23F</div></div>
  <div class="sw" style="background:var(--paper);border:1px solid var(--border-2)"><div class="name">Paper (canvas)</div><div class="hex">#F5F1E8</div></div>
</div></body></html>
