<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Brand Colors</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px}.row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.sw{aspect-ratio:1.4;border-radius:14px;display:flex;flex-direction:column;justify-content:flex-end;padding:14px;border:1px solid var(--border-1)}.sw .name{font-size:13px;font-weight:700}.sw .hex{font-family:var(--font-mono);font-size:11px;opacity:.7;margin-top:2px}</style>
</head><body>
<style>.lbl{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}</style>
<div class="lbl">Core — 2 signals + paper + ink</div>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw" style="background:var(--paper);border:1px solid var(--border-2)"><div class="name">Paper</div><div class="hex">#F5F1E8</div></div>
  <div class="sw" style="background:#1A1813;color:#F5F1E8"><div class="name">Ink</div><div class="hex">#1A1813</div></div>
  <div class="sw" style="background:var(--mint-400)"><div class="name">Mint — action</div><div class="hex">#4DE0A6</div></div>
  <div class="sw" style="background:var(--hot-500);color:#fff"><div class="name">Hot — emphasis</div><div class="hex">#FF6B47</div></div>
</div>
<div class="lbl" style="margin-top:18px">Restricted use</div>
<div class="row" style="grid-template-columns:repeat(4,1fr)">
  <div class="sw" style="background:var(--sun-marker)"><div class="name">Sun — marker only</div><div class="hex">#FFD23F</div></div>
  <div class="sw" style="background:var(--text-mint);color:#fff"><div class="name">Text Mint</div><div class="hex">#0A7A4F</div></div>
  <div class="sw" style="background:var(--text-hot);color:#fff"><div class="name">Text Hot</div><div class="hex">#C13E1F</div></div>
  <div class="sw" style="background:#FAF6E9;border:1px solid var(--border-2)"><div class="name">Paper Elevated</div><div class="hex">#FAF6E9</div></div>
</div></body></html>
