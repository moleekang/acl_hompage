<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Inputs</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--ink-900);font-family:var(--font-body);color:var(--fg-1)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field{display:flex;flex-direction:column;gap:6px}
  label{font-size:12px;color:var(--fg-2);font-weight:500}
  input,textarea,select{background:var(--ink-800);border:1px solid var(--border-2);color:var(--fg-1);padding:11px 14px;border-radius:8px;font-family:inherit;font-size:15px;outline:none;transition:border-color 180ms}
  input:focus,textarea:focus,select:focus{border-color:var(--electric-500);box-shadow:0 0 0 3px rgba(90,124,255,0.15)}
  input::placeholder{color:var(--fg-3)}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:999px;background:rgba(124,245,196,0.1);color:var(--mint-400);font-size:12px;font-weight:500;border:1px solid rgba(124,245,196,0.3)}
</style></head>
<body>
<div class="grid">
  <div class="field"><label>이름</label><input placeholder="홍길동"/></div>
  <div class="field"><label>회사</label><input value="에이아이콘 랩" /></div>
  <div class="field"><label>관심 분야</label><select><option>AI 영상 자동화</option><option>사내 교육</option></select></div>
  <div class="field"><label>태그</label><div style="display:flex;gap:6px;flex-wrap:wrap;padding-top:4px"><span class="pill">● 자동화</span><span class="pill">● n8n</span><span class="pill">● 영상</span></div></div>
</div>
</body></html>
