<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Spacing</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body{margin:0;padding:24px;background:var(--ink-900);color:var(--fg-1);font-family:var(--font-body)}
  .row{display:flex;align-items:center;gap:14px;padding:6px 0}
  .bar{height:14px;background:var(--mint-400);border-radius:2px}
  .lbl{font-family:var(--font-mono);font-size:12px;width:80px;color:var(--fg-2)}
  .px{font-family:var(--font-mono);font-size:11px;color:var(--fg-3)}
</style></head>
<body>
<div class="row"><div class="lbl">--s-1</div><div class="bar" style="width:4px"></div><div class="px">4px</div></div>
<div class="row"><div class="lbl">--s-2</div><div class="bar" style="width:8px"></div><div class="px">8px</div></div>
<div class="row"><div class="lbl">--s-3</div><div class="bar" style="width:12px"></div><div class="px">12px</div></div>
<div class="row"><div class="lbl">--s-4</div><div class="bar" style="width:16px"></div><div class="px">16px</div></div>
<div class="row"><div class="lbl">--s-5</div><div class="bar" style="width:24px"></div><div class="px">24px</div></div>
<div class="row"><div class="lbl">--s-6</div><div class="bar" style="width:32px"></div><div class="px">32px</div></div>
<div class="row"><div class="lbl">--s-7</div><div class="bar" style="width:48px"></div><div class="px">48px</div></div>
<div class="row"><div class="lbl">--s-8</div><div class="bar" style="width:64px"></div><div class="px">64px</div></div>
<div class="row"><div class="lbl">--s-9</div><div class="bar" style="width:96px"></div><div class="px">96px · section</div></div>
<div class="row"><div class="lbl">--s-10</div><div class="bar" style="width:128px"></div><div class="px">128px</div></div>
</body></html>
