<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>Type Scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>body{margin:0;padding:24px}.row{display:flex;align-items:baseline;gap:20px;padding:6px 0;border-bottom:1px solid var(--border-1)}.row:last-child{border:0}.meta{font-family:var(--font-mono);font-size:10px;color:var(--fg-3);min-width:140px}</style>
</head><body>
<div class="row"><div class="meta">Gaegu · 40px H1</div><h1 class="h-gaegu" style="margin:0">큰 제목입니다</h1></div>
<div class="row"><div class="meta">Gaegu · 28px H2</div><h2 class="h-gaegu" style="margin:0">중간 제목입니다</h2></div>
<div class="row"><div class="meta">Gowun · 20px H3</div><h3 style="margin:0;font-family:var(--font-body)">작은 제목</h3></div>
<div class="row"><div class="meta">Gowun · 17/1.7</div><p style="margin:0">본문은 한국어 가독성을 위해 17px, line-height 1.7로 설정합니다.</p></div>
<div class="row"><div class="meta">Small · 14</div><div class="small">작은 보조 텍스트입니다.</div></div>
<div class="row"><div class="meta">Micro · 12</div><div class="micro">EYEBROW · 카테고리</div></div>
</body></html>
